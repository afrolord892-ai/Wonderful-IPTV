name: Build Wonderful XMLTV EPG

on:
  push:
    branches: [main]
    paths:
      - 'playlists/Wonderful.m3u'
      - 'scripts/build_epg.py'
      - 'scripts/merge_country_epg.py'
      - '.github/workflows/build-epg.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: wonderful-epg-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Wonderful
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous published XMLTV guide
        run: |
          python - <<'PY'
          import gzip
          import shutil
          from pathlib import Path
          source = Path("epg/guide.xml.gz")
          target = Path("epg/guide.xml")
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit("The previously published guide.xml.gz is missing; refusing to build an empty guide.")
          with gzip.open(source, "rb") as compressed, target.open("wb") as xml:
              shutil.copyfileobj(compressed, xml, length=1024 * 1024)
          if target.stat().st_size == 0:
              raise SystemExit("The restored XMLTV guide is empty.")
          print(f"Restored {target.stat().st_size:,} XMLTV bytes from {source.stat().st_size:,} compressed bytes.")
          PY

      - name: Merge fresh country XMLTV guides
        run: python scripts/merge_country_epg.py

      - name: Verify guide coverage and attach EPG URL
        run: |
          python scripts/build_epg.py finalize
          rm -f epg/guide.xml

      - name: Publish playlist and EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/Wonderful.m3u playlists/Wonderful-report.json epg/guide.xml.gz epg/report.json epg/country-merge-report.json
          if git diff --cached --quiet; then
            echo "Wonderful playlist and EPG are already up to date."
          else
            git commit -m "Update Wonderful IPTV playlist and EPG"
            git pull --rebase origin main
            git push
          fi
